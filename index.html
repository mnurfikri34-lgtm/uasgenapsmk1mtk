<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CBT LOGIN</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loadingScreen">

    <div class="loader"></div>

    <p>Memuat Sistem CBT...</p>

</div>

<div class="container">

    <div class="login-box">

        <img
            src="logo.png"
            class="logo"
        >

        <h1>CBT EXAM</h1>

        <p class="subtitle">
            SMK N 1 MUNTOK
        </p>

        <input
            type="text"
            id="kode"
            placeholder="Kode Peserta"
        >

        <input
            type="password"
            id="token"
            placeholder="Token Ujian"
        >

        <button
            id="loginBtn"
            onclick="login()"
            disabled
        >
            Memuat Database...
        </button>

        <div class="status">
            🟢 Sistem Online
           <div id="countdown">

    ⏳ Sisa Waktu:
    <span id="timer">00:00:00</span>

</div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
